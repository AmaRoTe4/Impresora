name: Build-PrintAgent

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:       # permite lanzar manualmente

jobs:
  build:
    runs-on: windows-latest       # runner Windows para imprimir y compilar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Publish single-file
        run: |
          dotnet publish PrintAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -o out

      - name: Build Inno Setup installer
        run: |
          choco install innosetup -y          # instala Inno Setup CLI
          & 'C:\Program Files (x86)\Inno Setup 6\iscc.exe' index.iss

      - name: Upload published binaries
        uses: actions/upload-artifact@v4
        with:
          name: PrintAgent-win-x64
          path: out/*

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PrintAgent-installer
          path: dist/*
